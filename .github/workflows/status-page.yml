# Custom status page deploy (replaces Upptime's Static Site CI).
# Source lives in status-page/; Upptime keeps writing history/ and api/ data.
name: Status Page CI
on:
  push:
    branches: [master]
    paths:
      - "status-page/**"
      - ".github/workflows/status-page.yml"
  schedule:
    # Daily refresh of the bundled summary.json fallback copy
    - cron: "20 2 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: status-page-deploy
  cancel-in-progress: true
jobs:
  deploy:
    name: Build and deploy status page
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
      - name: Assemble site
        run: |
          mkdir -p build
          cp status-page/index.html build/index.html
          cp status-page/incidents.json build/incidents.json
          cp history/summary.json build/summary.json
      - name: Deploy to GitHub Pages
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GH_PAT || github.token }}
          publish_dir: build
          cname: status.sakneen.com
          force_orphan: false
          user_name: "Sakneen Status Bot"
          user_email: "github-actions[bot]@users.noreply.github.com"
