# Auto-translates English-only entries in status-page/incidents.json to Arabic.
# Needs the ANTHROPIC_API_KEY repo secret; without it the run is a green no-op.
# The commit is pushed with GH_PAT so it re-triggers Status Page CI (deploy).
name: Translate Incidents
on:
  push:
    branches: [master]
    paths:
      - "status-page/incidents.json"
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: translate-incidents
  cancel-in-progress: false
jobs:
  translate:
    name: Translate missing Arabic
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          token: ${{ secrets.GH_PAT || github.token }}
      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Install Anthropic SDK
        run: npm install --no-save @anthropic-ai/sdk
      - name: Translate
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: node .github/scripts/translate-incidents.mjs
      - name: Commit translations
        run: |
          if git diff --quiet; then
            echo "No changes to commit."
            exit 0
          fi
          git config user.name "Sakneen Status Bot"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add status-page/incidents.json
          git commit -m "chore: auto-translate incident narratives to Arabic"
          git push
